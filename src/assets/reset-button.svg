    <path d="M162 92h-37c-24.3 0-44 19.7-44 44s19.7 44 44 44c20.4 0 37.6-13.9 42.6-32.7" fill="none" stroke="#F6F7FB" stroke-width="17" stroke-linecap="round"/>
    <path d="M162 92v36h-36" fill="none" stroke="#F6F7FB" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="126" cy="136" r="11" fill="#F6F7FB" opacity=".92"/>

