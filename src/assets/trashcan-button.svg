<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title>Trashcan button</title>
  <defs>
    <linearGradient id="buttonBg" x1="32" y1="20" x2="224" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B3F52"/>
      <stop offset="1" stop-color="#1E1F26"/>
    </linearGradient>

    <linearGradient id="accent" x1="58" y1="48" x2="202" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#EF4444" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="64" fill="url(#buttonBg)"/>
  <circle cx="128" cy="112" r="94" fill="url(#glow)"/>
  <path d="M57 38h75c36.9 0 67 30.1 67 67v82" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="18" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <circle cx="128" cy="128" r="76" fill="url(#accent)"/>
    
    <path d="M91 101h74" stroke="#F6F7FB" stroke-width="16" stroke-linecap="round"/>
    <path d="M111 100V85c0-5.5 4.5-10 10-10h14c5.5 0 10 4.5 10 10v15" fill="none" stroke="#F6F7FB" stroke-width="14" stroke-linecap="round"/>
    <path d="M103 116 109 177c.6 6.1 5.7 11 11.9 11h14.2c6.2 0 11.3-4.8 11.9-11l6-61" fill="none" stroke="#F6F7FB" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M121 130v36M136 130v36" stroke="#F6F7FB" stroke-width="11" stroke-linecap="round" opacity=".82"/>

  </g>
